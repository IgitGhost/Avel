name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test (MSVC x64, Release)
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          arch: 'win64_msvc2022_64'
          cache: true
          # Since Qt 6.11 the online repository has a folder per architecture, which aqtinstall 3.3.0
          # (its latest release) can't read. Its master supports it (miurahr/aqtinstall#1000).
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset release

      - name: Build
        run: cmake --build --preset release

      # Saved even when a later step fails, so the next run doesn't build the dependencies again.
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Unit tests
        run: ctest --preset release --output-junit ctest-junit.xml

      # Job logs need a sign-in; annotations and the summary don't, so failures are readable by anyone.
      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: |
          $junit = 'build\release\ctest-junit.xml'
          if (-not (Test-Path $junit)) { exit 0 }
          $xml = [xml](Get-Content -Raw $junit)
          $failed = @($xml.SelectNodes('//testcase') | Where-Object { $_.GetAttribute('status') -eq 'fail' })
          if ($failed.Count -eq 0) { exit 0 }
          function Escape([string]$s) { $s.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A') }
          $names = $failed | ForEach-Object { $_.GetAttribute('name') }
          "::error title=$($failed.Count) test(s) failed::$(Escape ($names -join "`n"))"
          foreach ($t in $failed | Select-Object -First 9) {
            $out = $t.SelectSingleNode('system-out')
            $lines = @(if ($out) { $out.InnerText -split "`r?`n" | Where-Object { $_ -ne '' } })
            "::error title=$($t.GetAttribute('name'))::$(Escape (($lines | Select-Object -Last 25) -join "`n"))"
          }
          "## Failed tests`n" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $names | ForEach-Object { "- ``$_``" } | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
